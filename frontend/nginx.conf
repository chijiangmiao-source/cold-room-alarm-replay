# nginx：托管静态页面，并把 /api 透传给 Go API 服务。
# 关键：SSE 需要关闭 proxy_buffering，否则补发与实时帧会被 nginx 攒住。
upstream alarm_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://alarm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
